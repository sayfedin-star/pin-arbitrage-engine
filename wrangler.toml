name = "pin-arbitrage-engine"
main = "src/worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[vars]
PORT = "3456"

# 1. Workers KV Namespace for Shard Routing & Circuit Breakers
[[kv_namespaces]]
binding = "PIN_ENGINE_KV"
id = "5ef158495b3a4b8b800e50c3242fb92d"

# 2. D1 Database for Edge Search Autocomplete & Folders
[[d1_databases]]
binding = "PIN_D1_DB"
database_name = "pin-engine-edge"
database_id = "b0e9c924-4190-436f-909b-a7142696680b"

# 3. Hyperdrive Binding for Neon Central Hub
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "66ba4dc750fc464b991eb52558a8c026"

# 4. Preview Configuration for Worker Previews (Wrangler v4 preview builds)
[previews.vars]
PORT = "3456"

[[previews.kv_namespaces]]
binding = "PIN_ENGINE_KV"
id = "5ef158495b3a4b8b800e50c3242fb92d"

[[previews.d1_databases]]
binding = "PIN_D1_DB"
database_id = "b0e9c924-4190-436f-909b-a7142696680b"

[[previews.hyperdrive]]
binding = "HYPERDRIVE"
id = "66ba4dc750fc464b991eb52558a8c026"
