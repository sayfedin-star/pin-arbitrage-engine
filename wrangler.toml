name = "pin-arbitrage-engine"
main = "src/worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
PORT = "3456"

# ==============================================================================
# Edge Modernization Bindings (Hyperdrive, Workers KV, and Cloudflare D1)
# Note: Uncomment and fill in your real Cloudflare resource IDs once created.
# The worker automatically falls back gracefully to Neon Central Hub if unset.
# ==============================================================================

# 1. Hyperdrive Binding for Neon Central Hub
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<HYPERDRIVE_CONFIG_ID>"

# 2. Workers KV Namespace for Shard Routing & Circuit Breakers
# [[kv_namespaces]]
# binding = "PIN_ENGINE_KV"
# id = "<KV_NAMESPACE_ID>"

# 3. D1 Database for Edge Search Autocomplete & Folders
# [[d1_databases]]
# binding = "PIN_D1_DB"
# database_name = "pin-engine-edge"
# database_id = "<D1_DATABASE_ID>"

# 4. Preview Configuration for Worker Previews (Wrangler v4 preview builds)
[previews.vars]
PORT = "3456"

# [[previews.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<HYPERDRIVE_CONFIG_ID>"

# [[previews.kv_namespaces]]
# binding = "PIN_ENGINE_KV"
# id = "<KV_NAMESPACE_ID>"

# [[previews.d1_databases]]
# binding = "PIN_D1_DB"
# database_id = "<D1_DATABASE_ID>"
