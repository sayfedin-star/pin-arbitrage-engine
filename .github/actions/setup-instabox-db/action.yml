name: 'Setup InstaBox Database Bridge'
description: 'Wakes InstaBox VM if sleeping and establishes verified Cloudflare TCP tunnel to PostgreSQL'

inputs:
  instabox-api-key:
    description: 'InstaBox API Key for waking machine (optional)'
    required: false
    default: ''
  machine-id:
    description: 'InstaBox Machine ID'
    required: false
    default: 'm_agq2t32m5xv5joj67rqoze5h4u'
  db-hostname:
    description: 'Cloudflare Tunnel Hostname for DB'
    required: false
    default: 'db.hymum.com'
  skip-wakeup:
    description: 'Skip InstaBox API wakeup call when Stage 0 already woke the VM'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 1. Wake InstaBox Machine & Long-Poll Operation (if sleeping)
      shell: bash
      env:
        IB_API_KEY: ${{ inputs.instabox-api-key }}
        IB_MACHINE_ID: ${{ inputs.machine-id }}
        IB_SKIP_WAKEUP: ${{ inputs.skip-wakeup }}
      run: |
        if [ "${IB_SKIP_WAKEUP}" = "true" ] || [ "${SKIP_WAKEUP:-false}" = "true" ]; then
          echo "Skipping InstaBox wakeup API call (already woken by Stage 0)."
        elif [ -n "${IB_API_KEY}" ]; then
          IDEMP_KEY="gha-wake-${IB_MACHINE_ID}-${GITHUB_RUN_ID:-0}-$(date +%Y%m%d%H%M)"
          echo "Starting/Resuming InstaBox machine: ${IB_MACHINE_ID} (Idempotency-Key: ${IDEMP_KEY})..."
          START_RESP=$(curl -s -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/start" \
            -H "Authorization: Bearer ${IB_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${IDEMP_KEY}" \
            -d '{}' || echo "{}")

          OP_INFO=$(node -e '
            try {
              const d = JSON.parse(process.argv[1] || "{}");
              const opId = d.id || (d.error && d.error.operationId) || "";
              const state = d.state || "";
              const errCode = (d.error && d.error.code) || "";
              console.log(`${opId}|${state}|${errCode}`);
            } catch (_) {
              console.log("||");
            }
          ' "${START_RESP}")

          IFS='|' read -r OP_ID OP_STATE ERR_CODE <<< "${OP_INFO}"
          echo "InstaBox start response -> opId=${OP_ID:-none}, state=${OP_STATE:-unknown}, error=${ERR_CODE:-none}"

          if [ -n "${OP_ID}" ] && [ "${OP_STATE}" != "succeeded" ]; then
            echo "Long-polling InstaBox operation ${OP_ID} (?wait=25s) until VM is ready..."
            curl -s "https://api.instabox.sh/v1/operations/${OP_ID}?wait=25s" \
              -H "Authorization: Bearer ${IB_API_KEY}" > /dev/null 2>&1 || true
          fi
        fi

    - name: 2. Install and launch Cloudflare Access TCP Tunnel + Verify PostgreSQL Handshake
      shell: bash
      env:
        IB_API_KEY: ${{ inputs.instabox-api-key }}
        IB_MACHINE_ID: ${{ inputs.machine-id }}
        DB_HOSTNAME: ${{ inputs.db-hostname }}
      run: |
        if ! command -v cloudflared &> /dev/null; then
          echo "Installing cloudflared client..."
          curl -sL --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb > /dev/null 2>&1
          rm -f /tmp/cloudflared.deb
        fi

        echo "Starting Cloudflare TCP proxy to ${DB_HOSTNAME} on 127.0.0.1:5432..."
        cloudflared access tcp --hostname "${DB_HOSTNAME}" --url 127.0.0.1:5432 > /dev/null 2>&1 &

        # End-to-End PostgreSQL Wire Handshake Probe (sends 8-byte SSLRequest packet through tunnel to remote Postgres)
        echo "Verifying end-to-end PostgreSQL responsiveness over Cloudflare Tunnel (127.0.0.1:5432 -> ${DB_HOSTNAME})..."
        HANDSHAKE_OK=false
        for i in {1..20}; do
          if node -e '
            const net = require("node:net");
            const sock = net.connect({ host: "127.0.0.1", port: 5432, timeout: 1500 }, () => {
              sock.write(Buffer.from([0, 0, 0, 8, 4, 210, 22, 47]));
            });
            sock.on("data", (buf) => {
              sock.destroy();
              process.exit(buf.length > 0 && (buf[0] === 0x4e || buf[0] === 0x53) ? 0 : 1);
            });
            sock.on("timeout", () => { sock.destroy(); process.exit(1); });
            sock.on("error", () => { sock.destroy(); process.exit(1); });
          ' 2>/dev/null; then
            echo "✅ End-to-end PostgreSQL tunnel verified and responsive on 127.0.0.1:5432 in ${i}s!"
            HANDSHAKE_OK=true
            exit 0
          fi
          sleep 1
        done

        # If 20s probe failed, retry machine wakeup if API key is provided
        if [ "${HANDSHAKE_OK}" != "true" ] && [ -n "${IB_API_KEY}" ]; then
          echo "⚠️ Initial 20s probe failed. Attempting emergency InstaBox machine wakeup/resume on ${IB_MACHINE_ID}..."
          RETRY_IDEMP_KEY="gha-retry-wake-${IB_MACHINE_ID}-${GITHUB_RUN_ID:-0}-$(date +%s)"
          RETRY_START=$(curl -s -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/start" \
            -H "Authorization: Bearer ${IB_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${RETRY_IDEMP_KEY}" \
            -d '{}' || echo "{}")

          RETRY_OP_ID=$(node -e '
            try {
              const d = JSON.parse(process.argv[1] || "{}");
              console.log(d.id || (d.error && d.error.operationId) || "");
            } catch (_) { console.log(""); }
          ' "${RETRY_START}")

          if [ -n "${RETRY_OP_ID}" ]; then
            echo "Waiting for InstaBox resume operation ${RETRY_OP_ID} (?wait=25s)..."
            curl -s "https://api.instabox.sh/v1/operations/${RETRY_OP_ID}?wait=25s" \
              -H "Authorization: Bearer ${IB_API_KEY}" > /dev/null 2>&1 || true
          fi

          echo "Re-probing PostgreSQL wire protocol after machine wakeup..."
          for i in {1..15}; do
            if node -e '
              const net = require("node:net");
              const sock = net.connect({ host: "127.0.0.1", port: 5432, timeout: 1500 }, () => {
                sock.write(Buffer.from([0, 0, 0, 8, 4, 210, 22, 47]));
              });
              sock.on("data", (buf) => {
                sock.destroy();
                process.exit(buf.length > 0 && (buf[0] === 0x4e || buf[0] === 0x53) ? 0 : 1);
              });
              sock.on("timeout", () => { sock.destroy(); process.exit(1); });
              sock.on("error", () => { sock.destroy(); process.exit(1); });
            ' 2>/dev/null; then
              echo "✅ End-to-end PostgreSQL tunnel verified and responsive after wakeup retry in ${i}s!"
              HANDSHAKE_OK=true
              exit 0
            fi
            sleep 1
          done
        fi

        if [ "${HANDSHAKE_OK}" != "true" ]; then
          echo "❌ FATAL: Remote PostgreSQL handshake over Cloudflare Tunnel (127.0.0.1:5432 -> ${DB_HOSTNAME}) failed to respond."
          echo "--- Diagnostic Information ---"
          echo "cloudflared processes:"
          ps aux | grep "[c]loudflared" || echo "No running cloudflared process found!"
          echo "Network listening ports:"
          netstat -tulpn 2>/dev/null | grep 5432 || ss -tulpn 2>/dev/null | grep 5432 || echo "Port 5432 not listening!"
          echo "------------------------------"
          echo "Failing fast to prevent silent connection drop or unhandled stream ECONNRESET crash."
          exit 1
        fi
