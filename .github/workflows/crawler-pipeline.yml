name: Distributed Crawler & Intelligence Pipeline

on:
  schedule:
    # Runs daily at 02:00 UTC for fresh 24h delta tracking & competitor snapshots
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_account:
        description: 'Target account username to crawl immediately (leave empty to sweep scheduled active queue)'
        required: false
        type: string
        default: ''
      crawl_mode:
        description: 'Crawl Mode: sharded_boards (20-worker swarm - RECOMMENDED for 100% full catalog), discovery (profile created feed), or refresh (early-stop: 3 pages)'
        required: true
        type: choice
        options:
          - sharded_boards
          - discovery
          - refresh
        default: 'sharded_boards'
      max_pages:
        description: 'Maximum pages to fetch per account'
        required: false
        type: string
        default: '1000'
      personal_boards_only:
        description: 'Crawl Personal Boards only (exclude Group Boards)?'
        required: false
        type: boolean
        default: true
      target_boards:
        description: 'Target board names or IDs (comma-separated). Leave empty for all boards.'
        required: false
        type: string
        default: ''

concurrency:
  group: cluster-intelligence-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target_account != '' && format('account-{0}', inputs.target_account) || 'cron' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 0: Intelligent Dynamic Fleet Dispatcher (~10s)
  # Determines Mode:
  # - Mode A (Scheduled Sweep): 20 persistent workers across all active creators
  # - Mode B (Targeted Account Swarm): Catalog partitioned across 20 runners
  # ============================================================================
  dispatch:
    name: Stage 0 - Fleet Orchestrator & Dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix_tasks: ${{ steps.dispatcher.outputs.matrix_tasks }}
      mode: ${{ steps.dispatcher.outputs.mode }}
      task_count: ${{ steps.dispatcher.outputs.task_count }}
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Node.js 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 4. Execute Fleet Orchestrator & Dispatcher
        id: dispatcher
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
          TARGET_ACCOUNT: ${{ inputs.target_account }}
          CRAWL_MODE: ${{ inputs.crawl_mode || 'refresh' }}
          MAX_PAGES: ${{ inputs.max_pages || '1000' }}
          PERSONAL_BOARDS_ONLY: ${{ inputs.personal_boards_only == false && 'false' || 'true' }}
          TARGET_BOARDS: ${{ inputs.target_boards }}
        run: node scripts/creator-fleet-dispatcher.mjs

  # ============================================================================
  # STAGE 1: 20-Runner Concurrent Distributed Fleet Matrix
  # Executes simultaneously across up to 20 isolated Azure runner VMs with distinct IPs
  # ============================================================================
  crawl-fleet:
    name: Fleet Worker #${{ matrix.worker_slot }}/${{ matrix.worker_total }} - ${{ matrix.account_name }}
    needs: [dispatch]
    if: needs.dispatch.outputs.task_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.dispatch.outputs.matrix_tasks) }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Node.js 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Runner Egress IP Diagnostics
        run: |
          echo "=== Runner Egress IP ==="
          curl -s --max-time 3 https://api.ipify.org || echo "ip-diagnostics unavailable (non-fatal)"
          echo ""
          echo "========================"

      - name: 4. Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 5. Execute Fleet Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
          MODE: ${{ matrix.mode }}
          TARGET_ACCOUNT: ${{ matrix.target_account || '' }}
          ACCOUNT_ID: ${{ matrix.account_id }}
          ACCOUNT_IDS: ${{ matrix.account_ids || '' }}
          ALL_ACCOUNT_IDS: ${{ matrix.all_account_ids || '' }}
          WORKER_INDEX: ${{ matrix.worker_index }}
          WORKER_TOTAL: ${{ matrix.worker_total }}
          CRAWL_MODE: ${{ matrix.crawl_mode || 'refresh' }}
          MAX_PAGES: ${{ matrix.max_pages }}
          PERSONAL_BOARDS_ONLY: ${{ matrix.personal_boards_only }}
          TARGET_BOARDS: ${{ matrix.target_boards || '' }}
        run: node scripts/creator-velocity-crawler.mjs

  # ============================================================================
  # STAGE 2: Fleet Velocity & Report Consolidation Engine (~10s)
  # Consolidates metrics, generates Executive Report, and performs Hub maintenance
  # ============================================================================
  consolidate:
    name: Stage 2 - Creator Telemetry & Executive Report Consolidation
    needs: [dispatch, crawl-fleet]
    if: always() && needs.dispatch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Node.js 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 4. Execute Consolidation & Report Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ needs.dispatch.outputs.mode }}
          TARGET_ACCOUNT: ${{ inputs.target_account }}
        run: node scripts/creator-fleet-consolidator.mjs

      - name: 5. Recompute Domain Intelligence Rollup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/refresh-domain-rollup.mjs
