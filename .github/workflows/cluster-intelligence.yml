name: Cluster Intelligence & Arbitrage Pipeline

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seed_pin_id:
        description: 'Target Seed Pin ID to crawl immediately (leave empty to sweep all queued seeds)'
        required: false
        type: string
        default: ''
      max_pages:
        description: 'Maximum pagination depth per seed (default: 40)'
        required: false
        type: string
        default: '40'

concurrency:
  group: cluster-intelligence
  cancel-in-progress: false

jobs:
  crawl-and-synthesize:
    name: Crawl & Synthesize P2P Graph
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check Runner Egress IP
        run: |
          echo "=== GitHub Actions Runner Egress IP ==="
          curl -s https://api.ipify.org && echo ""
          echo "======================================="

      - name: Install dependencies
        run: npm ci

      - name: Execute Cluster Intelligence Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
          TARGET_PIN_ID: ${{ inputs.seed_pin_id }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: node scripts/cluster-intelligence.mjs
