name: Cluster Intelligence & Arbitrage Pipeline

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seed_pin_id:
        description: 'Target Seed Pin ID to crawl immediately (leave empty to sweep all queued seeds)'
        required: false
        type: string
        default: ''
      max_pages:
        description: 'Maximum pagination depth per seed (default: 60)'
        required: false
        type: string
        default: '60'

concurrency:
  group: cluster-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl-and-synthesize:
    name: Crawl Shard ${{ matrix.shardIndex + 1 }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check Runner Egress IP
        run: |
          echo "=== GitHub Actions Runner Egress IP (Shard ${{ matrix.shardIndex + 1 }}/4) ==="
          curl -s https://api.ipify.org && echo ""
          echo "=========================================================================="

      - name: Install dependencies
        run: npm ci

      - name: Execute Cluster Intelligence Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
          TARGET_PIN_ID: ${{ inputs.seed_pin_id }}
          MAX_PAGES: ${{ inputs.max_pages || '60' }}
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: 4
        run: node scripts/cluster-intelligence.mjs
