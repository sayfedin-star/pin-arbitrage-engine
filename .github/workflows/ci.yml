name: CI Quality & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DATABASE_TOPOLOGY: unified_postgres

jobs:
  verify:
    name: Code Quality, Typecheck & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Node.js 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Run syntax & inline script checks
        run: npm run check

      - name: 5. Execute automated UI & pipeline security audit
        run: node scripts/audit_ui.mjs

      - name: 6. Automated Deploy to InstaBox VPS (/data/app)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IB_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          IB_MACHINE_ID: 'm_agq2t32m5xv5joj67rqoze5h4u'
        run: |
          if [ -z "${IB_API_KEY}" ]; then
            echo "⚠️ INSTABOX_API_KEY is not configured in repository secrets; skipping auto-deployment."
            exit 0
          fi
          echo "Initiating production auto-deploy to InstaBox machine: ${IB_MACHINE_ID}..."
          IDEMP_KEY="gha-deploy-${IB_MACHINE_ID}-$(date +%s)"
          
          # 1. Wake or ensure InstaBox VM is awake with 25s long polling
          START_RESP=$(curl -s -f -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/start?wait=25s" \
            -H "Authorization: Bearer ${IB_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${IDEMP_KEY}" \
            -d '{}')
          
          echo "Machine wake response: ${START_RESP}"
          
          # Verify machine reached running state
          STATE=$(echo "${START_RESP}" | jq -r '.state // empty')
          if [ "${STATE}" != "running" ]; then
            for i in $(seq 1 6); do
              sleep 5
              INFO=$(curl -s -f -X GET "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}" \
                -H "Authorization: Bearer ${IB_API_KEY}")
              STATE=$(echo "${INFO}" | jq -r '.state // empty')
              [ "${STATE}" = "running" ] && break
            done
          fi
          if [ "${STATE}" != "running" ]; then
            echo "❌ Machine ${IB_MACHINE_ID} failed to reach running state (current: ${STATE})"
            exit 1
          fi

          # 2. Dispatch deployment commands inside /data/app with automated migrations and sudo restart
          DEPLOY_CMD="cd /data/app && git fetch origin main && git reset --hard origin/main && npm ci --omit=dev && node scripts/migrate.mjs && sudo systemctl restart pae-server"
          
          echo "Executing deployment and migration command in /data/app..."
          EXEC_RESP=$(curl -s -f -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/exec" \
            -H "Authorization: Bearer ${IB_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"cmd\": [\"bash\", \"-c\", \"${DEPLOY_CMD}\"]}")
          
          EXIT_CODE=$(echo "${EXEC_RESP}" | jq -r '.exitCode // 1')
          TIMED_OUT=$(echo "${EXEC_RESP}" | jq -r '.timedOut // false')
          STDOUT=$(echo "${EXEC_RESP}" | jq -r '.stdout // empty')
          STDERR=$(echo "${EXEC_RESP}" | jq -r '.stderr // empty')

          echo "Deployment STDOUT:"
          echo "${STDOUT}"
          if [ "${EXIT_CODE}" != "0" ] || [ "${TIMED_OUT}" = "true" ]; then
            echo "❌ Deployment failed with exitCode ${EXIT_CODE} (timedOut: ${TIMED_OUT})"
            echo "STDERR: ${STDERR}"
            exit 1
          fi

          # 3. Post-deployment /api/health verification checking deployed commit SHA
          EXPECTED_SHA="${{ github.sha }}"
          echo "Verifying health endpoint for deployed commit ${EXPECTED_SHA}..."
          VERIFIED=0
          for i in $(seq 1 10); do
            sleep 3
            HEALTH_EXEC=$(curl -s -f -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/exec" \
              -H "Authorization: Bearer ${IB_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"cmd\": [\"curl\", \"-s\", \"http://127.0.0.1:3000/api/health\"]}")
            
            HEALTH_RAW=$(echo "${HEALTH_EXEC}" | jq -r '.stdout // empty')
            HEALTH_STATUS=$(echo "${HEALTH_RAW}" | jq -r '.status // empty')
            HEALTH_COMMIT=$(echo "${HEALTH_RAW}" | jq -r '.commit // empty')

            if [ "${HEALTH_STATUS}" = "healthy" ]; then
              echo "Health check succeeded: status=${HEALTH_STATUS}, commit=${HEALTH_COMMIT}"
              if [ -n "${HEALTH_COMMIT}" ] && [ "${HEALTH_COMMIT}" != "unknown" ]; then
                if [[ "${EXPECTED_SHA}" == "${HEALTH_COMMIT}"* ]] || [[ "${HEALTH_COMMIT}" == "${EXPECTED_SHA}"* ]]; then
                  echo "✅ Verified deployed commit SHA matches ${EXPECTED_SHA}!"
                  VERIFIED=1
                  break
                fi
              else
                echo "✅ Health check succeeded (commit check skipped: '${HEALTH_COMMIT}')"
                VERIFIED=1
                break
              fi
            fi
            echo "Attempt $i: waiting for healthy service (status=${HEALTH_STATUS}, commit=${HEALTH_COMMIT})..."
          done

          if [ "${VERIFIED}" != "1" ]; then
            echo "❌ Post-deployment health verification failed!"
            exit 1
          fi

          echo "✅ Production on InstaBox machine ${IB_MACHINE_ID} successfully deployed, migrated, and verified."
