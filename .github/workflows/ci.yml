name: CI Quality & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_TOPOLOGY: unified_postgres

jobs:
  verify:
    name: Code Quality, Static Template Checks & Behavioral Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Node.js 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 4. Run syntax, template & ESLint checks (offline)
        env:
          DATABASE_URL: ''
        run: npm run check

      - name: 5. Run behavioral test suites (offline)
        env:
          DATABASE_URL: ''
        run: npm test

      - name: 6. Automated Deploy to InstaBox VPS (/data/app)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IB_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          IB_MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID || 'm_agq2t32m5xv5joj67rqoze5h4u' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL || 'https://app.hymum.com' }}
        run: |
          if [ -z "${IB_API_KEY}" ]; then
            echo "❌ INSTABOX_API_KEY secret is not configured — aborting deployment (fail-closed)."
            exit 1
          fi

          echo "=== Layer 1: Triggering Cloudflare Wake-Shield Pulse (${APP_PUBLIC_URL}/api/health) ==="
          if [ -n "${API_SECRET_KEY}" ]; then
            curl -s --max-time 8 -H "x-api-key: ${API_SECRET_KEY}" "${APP_PUBLIC_URL}/api/health" >/dev/null 2>&1 || true
          else
            curl -s --max-time 8 "${APP_PUBLIC_URL}/api/health" >/dev/null 2>&1 || true
          fi

          echo "=== Layer 1 & 2: Initiating InstaBox API Wakeup & Long-Polling for ${IB_MACHINE_ID} ==="
          IDEMP_KEY="gha-deploy-${IB_MACHINE_ID}-$(date +%s)"

          START_RESP=$(curl -s -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/start" \
            -H "Authorization: Bearer ${IB_API_KEY}" \
            -H "X-API-Key: ${IB_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${IDEMP_KEY}" \
            -d '{}')

          echo "Machine wake response: ${START_RESP}"

          OP_ID=$(echo "${START_RESP}" | jq -r '.id // .error.operationId // empty')
          OP_STATE=$(echo "${START_RESP}" | jq -r '.state // empty')

          if [ -n "${OP_ID}" ] && [ "${OP_ID}" != "null" ] && [ "${OP_STATE}" != "succeeded" ]; then
            for poll in 1 2 3; do
              echo "Long-polling wake operation ${OP_ID} (poll ${poll}/3)..."
              OP_RESP=$(curl -s -X GET "https://api.instabox.sh/v1/operations/${OP_ID}?wait=25s" \
                -H "Authorization: Bearer ${IB_API_KEY}" \
                -H "X-API-Key: ${IB_API_KEY}")
              OP_STATE=$(echo "${OP_RESP}" | jq -r '.state // empty')
              echo "Operation state: ${OP_STATE}"
              if [ "${OP_STATE}" = "succeeded" ] || [ "${OP_STATE}" = "failed" ]; then
                break
              fi
            done
          fi

          STATE=""
          RUNTIME_READY=""
          for i in $(seq 1 12); do
            INFO=$(curl -s -X GET "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}" \
              -H "Authorization: Bearer ${IB_API_KEY}" \
              -H "X-API-Key: ${IB_API_KEY}")
            STATE=$(echo "${INFO}" | jq -r '.state // empty')
            RUNTIME_READY=$(echo "${INFO}" | jq -r '.runtime.ready // empty')
            if [ "${STATE}" = "running" ]; then
              echo "✅ Machine ${IB_MACHINE_ID} is running (runtime.ready=${RUNTIME_READY:-unknown})."
              break
            fi
            echo "Attempt $i/12: Machine state is '${STATE}', waiting 4s..."
            sleep 4
          done

          if [ "${STATE}" != "running" ]; then
            echo "❌ Machine ${IB_MACHINE_ID} failed to reach running state (current: ${STATE})"
            exit 1
          fi

          echo "Probing InstaBox /exec agent readiness..."
          AGENT_READY=0
          for i in $(seq 1 12); do
            READY_RAW=$(curl -s -w "\n%{http_code}" -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/exec" \
              -H "Authorization: Bearer ${IB_API_KEY}" \
              -H "X-API-Key: ${IB_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"argv": ["echo", "ready"], "noHistory": true, "timeoutSeconds": 15}')
            READY_HTTP=$(echo "${READY_RAW}" | tail -n 1)
            READY_BODY=$(echo "${READY_RAW}" | sed '$d')
            READY_EXIT=$(echo "${READY_BODY}" | jq -r '.exitCode // -1' 2>/dev/null || echo "-1")
            if [ "${READY_HTTP}" = "200" ] && [ "${READY_EXIT}" = "0" ]; then
              echo "✅ InstaBox /exec agent is ready (attempt ${i}/12)."
              AGENT_READY=1
              break
            fi
            echo "Attempt $i/12: Waiting for /exec agent readiness (HTTP ${READY_HTTP}, exit=${READY_EXIT})..."
            sleep 3
          done

          if [ "${AGENT_READY}" != "1" ]; then
            echo "⚠️ Warning: /exec readiness probe did not return 200; proceeding to dispatch deploy command with full error reporting..."
          fi

          DEPLOY_CMD="git -c safe.directory=/data/app fetch origin main && git -c safe.directory=/data/app reset --hard HEAD && git -c safe.directory=/data/app clean -fd -e .env -e '.env.*' -e '*.env' && git -c safe.directory=/data/app checkout -f -B main origin/main && git -c safe.directory=/data/app reset --hard origin/main && (npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund) && node scripts/migrate.mjs && (bash scripts/instabox-boot-sync.sh --install-hook || true) && sudo systemctl restart pae-server"
          DEPLOY_PAYLOAD=$(jq -nc --arg cmd "${DEPLOY_CMD}" '{cmd: $cmd, cwd: "/data/app", timeoutSeconds: 300}')

          echo "Executing deployment, boot-hook installation, and migration command in /data/app..."
          EXEC_RAW=$(curl -s -w "\n%{http_code}" -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/exec" \
            -H "Authorization: Bearer ${IB_API_KEY}" \
            -H "X-API-Key: ${IB_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${DEPLOY_PAYLOAD}")

          EXEC_HTTP=$(echo "${EXEC_RAW}" | tail -n 1)
          EXEC_RESP=$(echo "${EXEC_RAW}" | sed '$d')

          if [ "${EXEC_HTTP}" != "200" ]; then
            echo "❌ InstaBox /exec API failed with HTTP ${EXEC_HTTP}: ${EXEC_RESP}"
            exit 1
          fi

          EXIT_CODE=$(echo "${EXEC_RESP}" | jq -r '.exitCode // 1')
          TIMED_OUT=$(echo "${EXEC_RESP}" | jq -r '.timedOut // false')
          STDOUT=$(echo "${EXEC_RESP}" | jq -r '.stdout // empty')
          STDERR=$(echo "${EXEC_RESP}" | jq -r '.stderr // empty')

          echo "Deployment STDOUT:"
          echo "${STDOUT}"
          if [ "${EXIT_CODE}" != "0" ] || [ "${TIMED_OUT}" = "true" ]; then
            echo "❌ Deployment failed with exitCode ${EXIT_CODE} (timedOut: ${TIMED_OUT})"
            echo "STDERR: ${STDERR}"
            exit 1
          fi

          # Post-deployment /api/health verification requiring real HEALTH_COMMIT prefix match
          EXPECTED_SHA="${{ github.sha }}"
          echo "Verifying health endpoint for deployed commit ${EXPECTED_SHA}..."
          VERIFIED=0
          for i in $(seq 1 12); do
            sleep 3
            HEALTH_RAW_RESP=$(curl -s -w "\n%{http_code}" -X POST "https://api.instabox.sh/v1/machines/${IB_MACHINE_ID}/exec" \
              -H "Authorization: Bearer ${IB_API_KEY}" \
              -H "X-API-Key: ${IB_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"argv": ["curl", "-s", "http://127.0.0.1:3000/api/health"], "noHistory": true, "timeoutSeconds": 15}')

            HEALTH_HTTP=$(echo "${HEALTH_RAW_RESP}" | tail -n 1)
            HEALTH_EXEC=$(echo "${HEALTH_RAW_RESP}" | sed '$d')
            HEALTH_RAW=$(echo "${HEALTH_EXEC}" | jq -r '.stdout // empty' 2>/dev/null || echo "")
            HEALTH_STATUS=$(echo "${HEALTH_RAW}" | jq -r '.status // empty' 2>/dev/null || echo "")
            HEALTH_COMMIT=$(echo "${HEALTH_RAW}" | jq -r '.commit // empty' 2>/dev/null || echo "")

            if [ "${HEALTH_STATUS}" = "healthy" ] && [[ "${HEALTH_COMMIT}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              if [[ "${EXPECTED_SHA,,}" == "${HEALTH_COMMIT,,}"* ]] || [[ "${HEALTH_COMMIT,,}" == "${EXPECTED_SHA,,}"* ]]; then
                echo "✅ Verified healthy service with matching deployed commit SHA (${HEALTH_COMMIT} == ${EXPECTED_SHA})!"
                VERIFIED=1
                break
              fi
            fi
            echo "Attempt $i/12: waiting for healthy service with commit ${EXPECTED_SHA:0:7} (exec_http=${HEALTH_HTTP}, status=${HEALTH_STATUS}, commit=${HEALTH_COMMIT})..."
          done

          if [ "${VERIFIED}" != "1" ]; then
            if [ -n "${API_SECRET_KEY}" ]; then
              echo "Attempting Layer 3 /api/internal/self-update webhook recovery..."
              curl -s -X POST "${APP_PUBLIC_URL}/api/internal/self-update" \
                -H "x-api-key: ${API_SECRET_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"commit\":\"${{ github.sha }}\"}" >/dev/null 2>&1 || true
            fi
            echo "❌ Post-deployment health & commit SHA verification failed!"
            exit 1
          fi

          echo "✅ Production on InstaBox machine ${IB_MACHINE_ID} successfully woken, deployed, boot-hooked, migrated, and verified."
